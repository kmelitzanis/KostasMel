<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudiScope - UI Preview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      height: 100vh;
      overflow: hidden;
    }
    .demo-note {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 12px;
      color: #00d4ff;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <!-- Custom Title Bar -->
  <div class="title-bar">
    <div class="title-bar-left">
      <div class="app-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span class="app-title">AudiScope</span>
    </div>
    <div class="title-bar-right">
      <button class="title-bar-button">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <line x1="0" y1="6" x2="12" y2="6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <button class="title-bar-button">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect x="1" y="1" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <button class="title-bar-button close">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.5"/>
          <line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="container">
    <!-- Drop Zone - Initial State -->
    <div id="drop-zone" class="drop-zone">
      <div class="drop-zone-content">
        <div class="drop-icon">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </div>
        <h2>Drop Audio File Here</h2>
        <p>or</p>
        <button class="primary-button">Select File</button>
        <p class="supported-formats">Supported: MP3, FLAC, WAV, M4A, AAC, OGG</p>
      </div>
    </div>
  </div>

  <div class="demo-note">
    🎵 AudiScope UI Preview - Static Demo
  </div>

  <script>
    // Add subtle animation to the drop zone
    const dropZone = document.getElementById('drop-zone');
    let scale = 1;
    let direction = 1;
    
    setInterval(() => {
      scale += 0.001 * direction;
      if (scale > 1.02 || scale < 0.98) {
        direction *= -1;
      }
      dropZone.style.transform = `scale(${scale})`;
    }, 50);
  </script>
</body>
</html>
