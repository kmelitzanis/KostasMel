<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SonoVis - Active Analysis Preview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { height: 100vh; overflow: hidden; }
    .demo-note {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 10px 20px; border-radius: 8px; font-size: 12px; color: #00d4ff; z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <div class="title-bar-left">
      <div class="app-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span class="app-title">SonoVis</span>
    </div>
    <div class="title-bar-right">
      <button class="title-bar-button"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="0" y1="6" x2="12" y2="6" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="title-bar-button"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="title-bar-button close"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
  </div>

  <div class="container">
    <div class="main-content">
      <div class="control-panel">
        <div class="file-info">
          <div class="file-name">Example_Song.mp3</div>
          <div class="file-details">3:45 • 44100 Hz • 2 channels</div>
        </div>
        <div class="controls">
          <button class="control-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>
          <button class="control-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"></polyline>
              <polyline points="23 20 23 14 17 14"></polyline>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="spectrum-container">
        <canvas id="spectrum-canvas"></canvas>
      </div>

      <div class="waveform-container">
        <canvas id="waveform-canvas"></canvas>
        <div class="playhead" style="left: 35%;"></div>
      </div>

      <div class="analysis-panel">
        <div class="analysis-item"><span class="label">Peak Frequency</span><span class="value">2450 Hz</span></div>
        <div class="analysis-item"><span class="label">Average Level</span><span class="value">68%</span></div>
        <div class="analysis-item"><span class="label">Duration</span><span class="value">3:45</span></div>
        <div class="analysis-item"><span class="label">Sample Rate</span><span class="value">44100 Hz</span></div>
      </div>
    </div>
  </div>

  <div class="demo-note">🎵 SonoVis - Active Analysis Preview</div>

  <script>
    const canvas = document.getElementById('spectrum-canvas');
    const ctx = canvas.getContext('2d');
    const waveCanvas = document.getElementById('waveform-canvas');
    const waveCtx = waveCanvas.getContext('2d');
    
    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      waveCanvas.width = waveCanvas.offsetWidth;
      waveCanvas.height = waveCanvas.offsetHeight;
    }
    
    resize();
    window.addEventListener('resize', resize);
    
    // Draw spectrum
    function drawSpectrum() {
      const barCount = 128;
      const barWidth = canvas.width / barCount;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < barCount; i++) {
        const value = Math.random() * 0.7 + Math.sin(i / 10 + Date.now() / 500) * 0.3;
        const barHeight = value * canvas.height;
        
        const gradient = ctx.createLinearGradient(0, canvas.height - barHeight, 0, canvas.height);
        gradient.addColorStop(0, '#00d4ff');
        gradient.addColorStop(0.5, '#0099ff');
        gradient.addColorStop(1, '#0066cc');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 2, barHeight);
        
        const reflectionGradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height + barHeight * 0.3);
        reflectionGradient.addColorStop(0, 'rgba(0, 212, 255, 0.2)');
        reflectionGradient.addColorStop(1, 'rgba(0, 212, 255, 0)');
        
        ctx.fillStyle = reflectionGradient;
        ctx.fillRect(i * barWidth, canvas.height, barWidth - 2, barHeight * 0.3);
      }
      
      requestAnimationFrame(drawSpectrum);
    }
    
    // Draw waveform
    function drawWaveform() {
      waveCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      waveCtx.fillRect(0, 0, waveCanvas.width, waveCanvas.height);
      
      waveCtx.strokeStyle = '#00d4ff';
      waveCtx.lineWidth = 1.5;
      waveCtx.beginPath();
      
      for (let i = 0; i < waveCanvas.width; i++) {
        const value = Math.sin(i / 20) * 0.5 + Math.sin(i / 5) * 0.2;
        const y = waveCanvas.height / 2 + value * waveCanvas.height / 3;
        
        if (i === 0) waveCtx.moveTo(i, y);
        else waveCtx.lineTo(i, y);
      }
      
      waveCtx.stroke();
    }
    
    drawSpectrum();
    drawWaveform();
  </script>
</body>
</html>
